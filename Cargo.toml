[package]
name = "dirtfetch"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "fastfetch-style neon system fetch in Rust with custom ASCII logos"
readme = "README.md"
repository = "https://github.com/SnowyFedora/dirtfetch"
keywords = ["fetch", "neofetch", "fastfetch", "system-info", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
